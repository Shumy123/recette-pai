<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff5d8f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Recettes PAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Itim&display=swap">
<style>
/* Identity: kawaii bento. Pastel strawberry-milk, mint and butter; everything round and squishy;
   a smiling lunchbox mascot; the bag is a two-compartment bento (lunch / goûter).
   Mochiy Pop One for headings, M PLUS Rounded 1c for reading, Itim for handwritten bits. */
:root {
  --bg: #fff6f9;
  --surface: #ffffff;
  --ink: #3e2b4f;            /* plum ink */
  --muted: #8a7499;
  --line: #f3dbe6;
  --accent: #ff5d8f;         /* strawberry */
  --accent-ink: #ffffff;
  --accent-soft: #ffe3ec;
  --accent-deep: #e0386d;
  --mint: #c9f2df; --mint-ink: #1f7a52;
  --butter: #fff0b3;
  --lilac: #e9defd;
  --sky: #d6ecff;
  --margin: #ff5d8f;
  --seyes: #f3dbe6; --seyes-faint: #fbeef3;
  --sun: #ffc94d;
  --sun-soft: #fff4cc;
  --ok: #1f8a5b;
  --ok-soft: #d6f5e6;
  --warn: #d6334f;
  --warn-soft: #ffe1e6;
  --check: #8a5a00;
  --check-soft: #fff0c7;
  --d1: #ffb4b4; --d2: #ffc8a6; --d3: #ffdc9a; --d4: #ffeea0; --d5: #def5b0;
  --d-ink: #3e2b4f;
  --shadow: 0 4px 0 #f6cfdd;
  --f-display: "Mochiy Pop One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --f-body: "M PLUS Rounded 1c", "Nunito", system-ui, -apple-system, sans-serif;
  --f-hand: "Itim", "Comic Sans MS", cursive;
  --r: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1828; --surface: #2a2135; --ink: #f6eafa; --muted: #b7a3c6; --line: #3d3049;
    --accent: #ff86aa; --accent-ink: #2a1020; --accent-soft: #46243a; --accent-deep: #ff5d8f;
    --mint: #1f4536; --mint-ink: #8ce3b9; --butter: #4a4020; --lilac: #3a2f55; --sky: #213a52;
    --margin: #ff86aa; --seyes: #4a3a56; --seyes-faint: #352a40;
    --sun: #ffd36e; --sun-soft: #43381c; --ok: #8ce3b9; --ok-soft: #1c3b2d;
    --warn: #ff8fa3; --warn-soft: #4a1f2a; --check: #ffd36e; --check-soft: #3d3218;
    --d1: #7a3f4a; --d2: #7f4d3a; --d3: #7a5d32; --d4: #6f6630; --d5: #4f6a35;
    --d-ink: #fff2f6;
    --shadow: 0 4px 0 #160f1d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f1828; --surface: #2a2135; --ink: #f6eafa; --muted: #b7a3c6; --line: #3d3049;
  --accent: #ff86aa; --accent-ink: #2a1020; --accent-soft: #46243a; --accent-deep: #ff5d8f;
  --mint: #1f4536; --mint-ink: #8ce3b9; --butter: #4a4020; --lilac: #3a2f55; --sky: #213a52;
  --margin: #ff86aa; --seyes: #4a3a56; --seyes-faint: #352a40;
  --sun: #ffd36e; --sun-soft: #43381c; --ok: #8ce3b9; --ok-soft: #1c3b2d;
  --warn: #ff8fa3; --warn-soft: #4a1f2a; --check: #ffd36e; --check-soft: #3d3218;
  --d1: #7a3f4a; --d2: #7f4d3a; --d3: #7a5d32; --d4: #6f6630; --d5: #4f6a35;
  --d-ink: #fff2f6;
  --shadow: 0 4px 0 #160f1d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; font-weight: 500;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(100px + env(safe-area-inset-bottom, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; text-wrap: balance; margin: 0; line-height: 1.2; color: var(--ink); }
h1 { font-size: 1.3rem; white-space: nowrap; }
h2 { font-size: 1.4rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.label { font-family: var(--f-body); font-size: .74rem; font-weight: 800; letter-spacing: .06em; color: var(--accent-deep); }

/* Header with the lunchbox mascot */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-block: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.brand { display: flex; align-items: center; gap: 8px; flex: none; }
.brand-mark { width: 44px; height: 40px; flex: none; }
.brand-mark svg { width: 44px; height: 40px; display: block; }
@media (prefers-reduced-motion: no-preference) {
  .brand-mark svg { animation: wobble 3.2s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes wobble { 0%, 100% { transform: rotate(0); } 8% { transform: rotate(-6deg); } 16% { transform: rotate(5deg); } 24% { transform: rotate(0); } }
}
.stamp {
  display: inline-block; font-family: var(--f-display); font-size: .62rem; color: var(--accent-ink); background: var(--accent);
  border-radius: 999px; padding: 2px 7px; margin-left: 6px; transform: rotate(-8deg) translateY(-6px);
}
#foyer-pill { flex: none; display: inline-flex; align-items: center; gap: 2px; padding: 3px 6px; border-radius: 999px; background: var(--surface); box-shadow: 0 3px 0 var(--line); }
#foyer-pill[hidden] { display: none; }
#foyer-pill .ficon { width: 36px; height: 36px; }
#foyer-pill .plus { font: 800 .8rem var(--f-body); color: var(--muted); padding: 0 4px 0 2px; }
#foyer-pill .txt { font: 800 .76rem var(--f-body); color: var(--mint-ink); padding: 0 6px; }

.chip-list { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px;
  padding: 5px 13px; font: 700 .86rem var(--f-body); cursor: pointer; transition: transform .15s, background .15s;
}
.chip:hover { transform: translateY(-1px); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 0 var(--accent-deep); }
.chip:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, label:focus-within, summary:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.pill { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; border-radius: 999px; padding: 2px 10px; font-size: .76rem; font-weight: 800; }
.pill.ok { background: var(--mint); color: var(--mint-ink); }
.pill.ok::before { content: "✿"; font-size: .8em; }
.pill.warn { background: var(--warn-soft); color: var(--warn); white-space: normal; }
.pill.check { background: var(--check-soft); color: var(--check); }
.pill.meal { background: var(--butter); color: var(--ink); font-weight: 700; }
.pill.perso { background: var(--lilac); color: var(--ink); }

.btn {
  appearance: none; border: 0; border-radius: 999px; padding: 11px 20px; font: 800 .95rem var(--f-body);
  background: var(--accent); color: var(--accent-ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  box-shadow: 0 4px 0 var(--accent-deep); transition: transform .1s, box-shadow .1s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-deep); }
.btn.ghost { background: var(--surface); color: var(--accent-deep); box-shadow: 0 3px 0 var(--line); border: 2px solid var(--line); }
.btn.add { background: var(--accent-soft); color: var(--accent-deep); box-shadow: 0 3px 0 var(--line); }
.btn.danger { background: var(--warn); color: #fff; box-shadow: 0 4px 0 #9e1f36; }
.btn.small { padding: 7px 13px; font-size: .84rem; }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }

.idea { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
.idea-band { background: var(--sun); height: 8px; }
.idea-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.ingr { margin: 0; padding-left: 1.2em; display: grid; gap: 3px; }
.ingr li::marker { content: "✦ "; color: var(--accent); font-size: .8em; }
.empty { border: 2.5px dashed var(--line); border-radius: var(--r); padding: 24px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }

/* Week: pastel versions of the menu day bands */
.week { display: grid; grid-template-columns: auto repeat(5, 1fr) auto; gap: 6px; align-items: stretch; }
.week .nav { appearance: none; border: 0; background: var(--surface); color: var(--accent-deep); width: 30px; font: 800 1.2rem var(--f-body); cursor: pointer; border-radius: 999px; box-shadow: 0 3px 0 var(--line); }
.week .nav:disabled { opacity: .3; cursor: default; }
.day {
  appearance: none; border: 0; border-radius: 18px; padding: 8px 2px 9px; cursor: pointer; font: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 0; position: relative;
  background: var(--surface); color: var(--ink); box-shadow: 0 3px 0 var(--line), inset 0 0 0 2px var(--dc);
  transition: transform .2s cubic-bezier(.3,1.6,.5,1);
}
.day .dn { font-size: .66rem; font-weight: 800; letter-spacing: .04em; text-transform: lowercase; color: var(--muted); }
.day .dd { font-family: var(--f-display); font-size: 1.3rem; line-height: 1.15; }
.day[aria-pressed="true"] { background: var(--dc); color: var(--d-ink); transform: translateY(-4px) scale(1.04); box-shadow: 0 4px 0 var(--line); }
.day[aria-pressed="true"] .dn { color: var(--d-ink); }
.day:disabled { opacity: .35; cursor: default; }
.day .today { position: absolute; bottom: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.day .ready { position: absolute; top: -8px; right: -5px; width: 21px; height: 21px; border-radius: 50%; background: var(--ok); color: #fff; font-size: .7rem; font-weight: 900; display: grid; place-items: center; border: 2.5px solid var(--bg); }
.menu-card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.menu-head { padding: 14px 18px; background: var(--dc); color: var(--d-ink); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.menu-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 16px; }
.menu-sec { display: flex; flex-direction: column; gap: 10px; }
.menu-sec > h3 { font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
.menu-sec > h3::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 16px 0 0 var(--sun), 32px 0 0 var(--mint); margin-right: 34px; }
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.items li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding-bottom: 6px; border-bottom: 2px dotted var(--line); }
.items li:last-child { border-bottom: 0; padding-bottom: 0; }
.items .course { font-size: .72rem; font-weight: 800; color: var(--muted); width: 100%; }
.match { display: flex; flex-direction: column; gap: 10px; }

/* Canteen menu as inspiration: a little speech bubble */
.inspi { position: relative; background: var(--dc); color: var(--d-ink); border-radius: var(--r); padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; }
.inspi::after { content: ""; position: absolute; left: 34px; bottom: -10px; width: 20px; height: 20px; background: var(--dc); transform: rotate(45deg); border-radius: 4px; }
.inspi .label { color: var(--d-ink); opacity: .8; }
.inspi .muted { color: var(--d-ink); opacity: .75; }
.inspi strong { font-weight: 800; }
.inspi .pill.meal { background: var(--surface); }

.theme { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); }
.theme > .label, .theme > .row.between .label { display: inline-flex; align-self: flex-start; background: var(--accent-soft); padding: 2px 10px; border-radius: 999px; }
.quick { display: flex; flex-direction: column; }
.quick .pick { padding: 6px 0; border-bottom: 2px dotted var(--line); }
.quick .pick:last-child { border-bottom: 0; }
.pick { display: flex; gap: 10px; align-items: center; }
.pick > .mini, .pick > .qtext, .pick > input { flex: 1; min-width: 0; }
form.pick { flex-direction: row; gap: 10px; }
form.pick input[type="text"] { padding: 8px 14px; }
.qtext { font-weight: 700; }
.mini { appearance: none; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; background: transparent; border: 0; padding: 6px 0; display: flex; flex-direction: column; gap: 3px; }
.mini strong { font-weight: 800; font-size: 1rem; line-height: 1.3; }
.mini:hover strong { color: var(--accent-deep); }
.mini .row { gap: 5px; }
.ai-out { background: var(--lilac); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }

/* The bag: a two-compartment bento box */
.sac {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px; border-radius: 26px;
  background: var(--accent); box-shadow: 0 6px 0 var(--accent-deep);
}
.sac > *:not(.sac-sec) { grid-column: 1 / -1; }
.sac > .row.between { padding: 2px 6px 4px; min-height: 44px; }
.sac > .row.between h3 { font-family: var(--f-display); font-size: 1.15rem; color: var(--accent-ink); }
.sac > .row.between h3::after { content: " ♡"; }
.sac.pret > .row.between .pill.ok { background: var(--sun); color: #3e2b4f; transform: rotate(6deg); font-family: var(--f-display); font-weight: 400; padding: 4px 12px; box-shadow: 0 3px 0 rgba(0,0,0,.12); }
.sac.pret > .row.between .pill.ok::before { content: "★"; }
.sac-sec { background: var(--surface); border-radius: 18px; padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 120px; }
.sac-sec:nth-child(2) { background: var(--mint); }
.sac-sec:nth-child(3) { background: var(--butter); }
.sac-sec > .label { color: var(--ink); font-family: var(--f-display); font-weight: 400; font-size: .82rem; letter-spacing: 0; }
.sac-sec > p.muted { font-family: var(--f-hand); color: var(--ink); opacity: .6; }
.sac-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.sac-list li { display: flex; align-items: center; justify-content: space-between; gap: 4px; background: var(--surface); border-radius: 12px; padding: 5px 4px 5px 10px; font-family: var(--f-hand); font-size: 1.02rem; line-height: 1.25; color: var(--ink); }
.sac-list li > :first-child { min-width: 0; overflow-wrap: anywhere; }
.linkish { appearance: none; background: none; border: 0; padding: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.linkish .voir { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-deep); font-size: .72rem; font-weight: 800; white-space: nowrap; vertical-align: 2px; }
.x { appearance: none; border: 0; background: var(--accent-soft); color: var(--accent-deep); font: 800 1rem var(--f-body); line-height: 1; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; flex: none; }
.sac-form { gap: 10px; background: var(--surface); border-radius: 18px; padding: 12px; }
.sac-form input[type="text"] { font-family: var(--f-hand); font-size: 1.05rem; }
.sac > .row:last-child .btn { background: var(--surface); color: var(--accent-deep); box-shadow: 0 4px 0 var(--accent-deep); }
@media (max-width: 520px) { .sac { grid-template-columns: 1fr; } .sac-sec { min-height: 0; } }

/* Food stickers */
.ficon { width: 34px; height: 34px; flex: none; display: inline-block; filter: drop-shadow(0 2px 0 rgba(62,43,79,.12)); }
.ficon svg { width: 100%; height: 100%; display: block; overflow: visible; }
.ficon.sm { width: 26px; height: 26px; }
.ficon.lg { width: 42px; height: 42px; }
.ficon.xl { width: 58px; height: 58px; }
.ficon.photo { border-radius: 30%; overflow: hidden; background: var(--accent-soft); box-shadow: 0 0 0 2.5px var(--surface), 0 0 0 4px var(--line); filter: none; }
.ficon.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card > .ficon.photo { width: 58px; height: 58px; }
.hero-photo { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 22px; box-shadow: 0 4px 0 var(--line); background: var(--accent-soft); }
.hero { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.hero figcaption { font-size: .7rem; padding-left: 6px; overflow-wrap: anywhere; }
.photo-pick { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.photo-pick input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.photo-apercu { width: 84px; height: 84px; flex: none; border-radius: 20px; background: var(--accent-soft); border: 2px dashed var(--line); display: grid; place-items: center; overflow: hidden; text-align: center; padding: 4px; }
.photo-apercu img { width: 84px; height: 84px; object-fit: cover; }
.mini { flex-direction: row; align-items: center; gap: 10px; }
.mini-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.sac-list li { justify-content: flex-start; }
.sac-list li > .ficon + * { flex: 1; }
.sac-list li > :first-child { min-width: auto; }
@media (prefers-reduced-motion: no-preference) {
  .card:hover .ficon, .mini:hover .ficon { animation: boing .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes boing { 0% { transform: scale(1); } 40% { transform: scale(1.15) rotate(-6deg); } 100% { transform: scale(1); } }
}

/* Week view */
.vue-toggle { margin-top: -4px; }
.sem-nav { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.sem-nav .nav { appearance: none; border: 0; background: var(--surface); color: var(--accent-deep); width: 34px; height: 34px; font: 800 1.2rem var(--f-body); cursor: pointer; border-radius: 999px; box-shadow: 0 3px 0 var(--line); }
.sem-nav .nav:disabled { opacity: .3; cursor: default; }
.sem-bilan { display: flex; flex-direction: column; gap: 5px; align-items: center; font-family: var(--f-display); font-size: .95rem; color: var(--accent-deep); }
.sem-barre { display: block; width: 100%; height: 10px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 2px var(--line); overflow: hidden; }
.sem-barre > span { display: block; height: 100%; background: var(--ok); border-radius: 999px; transition: width .4s; }
.sem-jour { background: var(--surface); border-radius: var(--r); box-shadow: 0 3px 0 var(--line); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; border-left: 8px solid var(--dc); }
.sem-jour.pret { box-shadow: 0 3px 0 var(--line), inset 0 0 0 2px var(--ok); }
.day .ready.absent { background: var(--muted); }
.discret { appearance: none; background: none; border: 0; padding: 4px 2px; font: 700 .82rem var(--f-body); color: inherit; opacity: .75; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.sac .discret { color: var(--accent-ink); margin-left: auto; }
.sac > .row:last-child { flex-wrap: nowrap; min-height: 52px; }
.sac.absent { text-align: center; color: var(--accent-ink); padding-block: 18px; }
.sac.absent h3 { font-family: var(--f-display); font-size: 1.15rem; color: var(--accent-ink); }
.sem-jour.off { flex-direction: row; justify-content: space-between; align-items: center; opacity: .6; border-left-color: var(--line); padding: 10px 14px; }
.sem-tete { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sem-nom { font-family: var(--f-display); font-size: 1rem; }
.sem-cols { display: flex; flex-direction: column; gap: 8px; }
.sem-cols > div { display: flex; flex-direction: column; gap: 4px; }
.sem-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; font-size: .86rem; font-weight: 700; }
.sem-list li { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; background: var(--bg); border-radius: 999px; padding: 2px 10px 2px 3px; line-height: 1.3; }
.sem-cantine { margin: 0; color: var(--muted); font-family: var(--f-hand); }
/* Ajouter helpers */
.aides { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.aides .label { grid-column: 1 / -1; }
.aide { appearance: none; text-align: left; font: inherit; color: var(--ink); cursor: pointer; background: var(--sky); border: 0; border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; box-shadow: var(--shadow); transition: transform .2s cubic-bezier(.3,1.6,.5,1); }

  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 5px 12px; cursor: pointer; text-align: left; width: 100%; color: inherit; font: inherit;
  transition: transform .2s cubic-bezier(.3,1.6,.5,1);
}
.card:hover { transform: translateY(-2px); }
.card > .ficon { grid-row: span 2; }
.card .meta { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 5px; }
.card h3 { min-width: 0; text-align: left; align-self: end; overflow-wrap: anywhere; font-family: var(--f-body); font-weight: 800; font-size: 1.04rem; }
.card .pill.ok { display: none; }
.fav { color: var(--sun); font-size: 1.25rem; line-height: 1; }

form { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .label-like { font-weight: 800; }
input[type="text"], input[type="number"], input[type="search"], textarea {

input:focus, textarea:focus { border-color: var(--accent); }
textarea { min-height: 120px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.check-box { border-radius: 16px; padding: 12px 14px; font-size: .93rem; display: flex; flex-direction: column; gap: 3px; }
.check-box.ok { background: var(--mint); color: var(--mint-ink); }
.check-box.warn { background: var(--warn-soft); color: var(--warn); }

.allergen-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 8px; }
.allergen { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; cursor: pointer; font-weight: 800; }
.allergen input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.allergen:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-deep); }
.group-title { margin-top: 8px; }
.notice { background: var(--sun-soft); border-radius: 16px; padding: 12px 16px; font-size: .9rem; }

.drop { position: relative; border: 2.5px dashed var(--accent); border-radius: var(--r); padding: 22px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; cursor: pointer; color: var(--accent-deep); background: var(--accent-soft); }
.drop strong { font-family: var(--f-display); font-weight: 400; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }

.preview { max-height: 320px; overflow-y: auto; border: 2px solid var(--line); border-radius: 16px; }
.preview div { padding: 8px 12px; border-bottom: 2px dotted var(--line); font-size: .9rem; }

.spinner { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--accent-soft); border-top-color: var(--accent); flex: none; }

  // ---------- Dish photos ----------
  // Shrink before upload: a phone photo is often 4–8 MB, 1280 px is plenty for a recipe card.
  async function reduirePhoto(file, max = 1280, q = 0.82) {

    (r.autres || "").split(/[,;\n]/).map(s => s.trim()).filter(Boolean).forEach(mot => {

  // ---------- Matching cantine items to recipes ----------

  function escFermer(e) { if (e.key === "Escape") fermer(); }

  // First sign-in on an empty base: copy the data exported from the Claude version.
  async function importerSiVide(db) {
    const deja = await db.collection("recettes").limit(1).get();
    if (!deja.empty) return;
    let seed;
    try { const r = await fetch("data/seed.json", { cache: "no-store" }); if (!r.ok) return; seed = await r.json(); } catch (e) { return; }
    const ecrits = [];
    if (seed.reglages) ecrits.push([db.doc("reglages/foyer"), seed.reglages]);
    for (const col of ["recettes", "menus", "paniers"]) for (const [id, d] of Object.entries(seed[col] || {})) ecrits.push([db.collection(col).doc(id), d]);
    const banner = document.getElementById("banner");
    banner.textContent = "Première ouverture : je range vos recettes…"; banner.hidden = false;
    for (let i = 0; i < ecrits.length; i += 400) {
      const b = db.batch();
      ecrits.slice(i, i + 400).forEach(([ref, d]) => b.set(ref, d));
      await b.commit();
    }
    banner.hidden = true;
  }

  // Recipes Claude adds each week ship in data/nouveautes.json. Each one is copied into the base once,
  // so a recipe the family deletes does not come back.
  async function importerNouveautes(db) {
    let n;
    try { const r = await fetch("data/nouveautes.json", { cache: "no-store" }); if (!r.ok) return; n = await r.json(); } catch (e) { return; }
    const ref = db.doc("reglages/nouveautes");
    const vus = ((await ref.get()).data() || {}).ids || [];
    const ids = Object.keys(n.recettes || {}).filter(id => !vus.includes(id));
    if (!ids.length) return;
    const b = db.batch();
    ids.forEach(id => b.set(db.collection("recettes").doc(id), n.recettes[id]));
    b.set(ref, { ids: vus.concat(ids) });
    await b.commit();
  }

      if (!user) { state.ecran = ecranConnexion(); render(); return; }
      try { await db.doc("reglages/foyer").get(); }
      catch (e) { if (e && e.code === "permission-denied") { state.ecran = ecranRefus(user.email); render(); return; } }
      state.ecran = null;
      try { await importerSiVide(db); } catch (e) {}
      try { await importerNouveautes(db); } catch (e) {}
      demarrer(db);
    });
  }
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
